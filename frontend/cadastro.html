<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriClinic - Cadastro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1 class="auth-title" style="font-size: 1.5rem;">Criar Nova Conta</h1>
            <p class="auth-subtitle">Selecione o tipo de perfil desejado</p>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('paciente')">Paciente</button>
                <button class="tab-btn" onclick="switchTab('nutricionista')">Nutricionista</button>
            </div>

            <!-- Cadastro Paciente -->
            <div id="tab-paciente" class="tab-content active">
                <form id="form-paciente">
                    <div class="input-group">
                        <label>Nome Completo</label>
                        <input type="text" id="p-name" class="input-control" required>
                    </div>
                    <div class="input-group">
                        <label>E-mail</label>
                        <input type="email" id="p-email" class="input-control" required>
                    </div>
                    <div class="input-group">
                        <label>Data de Nascimento</label>
                        <input type="date" id="p-birth" class="input-control" required>
                    </div>
                    <div class="input-group">
                        <label>Senha</label>
                        <input type="password" id="p-password" class="input-control" minlength="8" required>
                    </div>
                    <button type="submit" class="btn">Cadastrar Paciente</button>
                </form>
            </div>

            <!-- Cadastro Nutricionista -->
            <div id="tab-nutricionista" class="tab-content">
                <form id="form-nutricionista">
                    <div class="input-group">
                        <label>Nome Completo</label>
                        <input type="text" id="n-name" class="input-control" required>
                    </div>
                    <div class="input-group">
                        <label>E-mail</label>
                        <input type="email" id="n-email" class="input-control" required>
                    </div>
                    <div class="input-group">
                        <label>CRN</label>
                        <input type="text" id="n-crn" class="input-control" placeholder="Ex: CRN-3 12345" required>
                    </div>
                    <div class="input-group">
                        <label>Especialidade</label>
                        <input type="text" id="n-specialty" class="input-control" placeholder="Ex: Esportiva" required>
                    </div>
                    <div class="input-group">
                        <label>Senha</label>
                        <input type="password" id="n-password" class="input-control" minlength="8" required>
                    </div>
                    <button type="submit" class="btn">Cadastrar Nutricionista</button>
                </form>
            </div>

            <div id="cadastro-msg" class="alert"></div>

            <p class="mt-4" style="font-size: 0.9rem; color: var(--text-muted);">
                Já possui conta? <a href="index.html">Faça login</a>
            </p>
        </div>
    </div>
    <script src="js/api.js?v=3"></script>
    <script src="js/cadastro.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriClinic - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1 class="auth-title">NutriClinic</h1>
            <p class="auth-subtitle">Bem-vindo de volta! Acesse sua conta.</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" class="input-control" placeholder="seu@email.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" class="input-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn">Entrar</button>
                <div id="login-error" class="alert alert-error">Credenciais inválidas. Verifique seu e-mail e senha.</div>
            </form>
            <p class="mt-4" style="font-size: 0.9rem; color: var(--text-muted);">
                Ainda não tem conta? <a href="cadastro.html">Cadastre-se aqui</a>
            </p>
        </div>
    </div>
    <script src="js/api.js?v=3"></script>
    <script src="js/login.js?v=3"></script>
</body>
</html>
